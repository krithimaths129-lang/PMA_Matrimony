<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | PMA Matrimony</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


<div class="auth-container">


    <!-- BRAND SIDE -->

    <div class="auth-brand">

        <div class="logo auth-logo">

            <span class="logo-mark">P</span>

            <div>
                <h2>PMA</h2>
                <small>MATRIMONY</small>
            </div>

        </div>


        <div class="auth-brand-content">

            <span class="eyebrow">
                YOUR NEW BEGINNING
            </span>

            <h1>
                Create your
                <span>story.</span>
            </h1>

            <p>
                Join a trusted community of individuals
                looking for meaningful relationships.
            </p>

        </div>

    </div>


    <!-- SIGNUP -->

    <div class="auth-form-container">

        <div class="auth-form">

            <a href="landing_page.html"
               class="back-link">
                ← Back to PMA
            </a>


            <h2>Create Account</h2>

            <p class="form-intro">
                Start your journey with PMA Matrimony.
            </p>


            <form id="signupForm">


                <div class="form-row">

                    <div class="form-group">

                        <label>First Name</label>

                        <input
                            type="text"
                            id="firstName"
                            placeholder="First name">

                    </div>


                    <div class="form-group">

                        <label>Last Name</label>

                        <input
                            type="text"
                            id="lastName"
                            placeholder="Last name">

                    </div>

                </div>


                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="you@example.com">

                    <small
                        class="error-message"
                        id="signupEmailError">
                    </small>

                </div>


                <div class="form-group">

                    <label>Mobile Number</label>

                    <input
                        type="tel"
                        id="signupMobile"
                        placeholder="10-digit mobile number"
                        maxlength="10">

                    <small
                        class="error-message"
                        id="signupMobileError">
                    </small>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>Gender</label>

                        <select id="gender">

                            <option value="">
                                Select
                            </option>

                            <option value="male">
                                Male
                            </option>

                            <option value="female">
                                Female
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Age</label>

                        <input
                            type="number"
                            id="age"
                            placeholder="Age"
                            min="18"
                            max="80">

                    </div>

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password">

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('signupPassword')">

                            Show

                        </button>

                    </div>

                </div>


                <label class="terms-check">

                    <input
                        type="checkbox"
                        id="terms">

                    <span>
                        I agree to the PMA Matrimony
                        Terms & Privacy Policy.
                    </span>

                </label>


                <small
                    class="error-message"
                    id="signupError">
                </small>


                <button
                    type="submit"
                    class="btn btn-primary auth-submit">

                    Continue to Profile

                </button>


            </form>


            <p class="signup-text">

                Already have an account?

                <a href="login.html">
                    Sign In
                </a>

            </p>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
